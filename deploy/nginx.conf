# Vite's assets have content hashes in their names; everything else is
# revalidated, so a deploy shows up on the next load.
map $uri $canvas_cache {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  # Rooms (/r/<id>) and /new are routes of the single page.
  location / { try_files $uri $uri/ /index.html; }

  add_header Cache-Control $canvas_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  # Drawings come from other people, so only this origin may run code or be
  # fetched. Excalidraw needs inline styles, data:/blob: images and fonts,
  # and https: frames for its embeds (which it allow-lists itself).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
